name: Deploy DUAL-ASCENT to GitHub Pages

on:
  push:
    branches: [main]
    # Deliberately no paths filter: every main push, even README changes, redeploys.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package static site
    # Also protect workflow_dispatch: selecting a feature branch cannot publish it.
    if: github.repository == 'QSOLKCB/DUAL-ASCENT' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the merged source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Run standard-library regression tests
        run: python -I -B -m unittest discover -s tests -v

      - name: Stage only the three static browser-game assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -- index.html styles.css app.js _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish main to GitHub Pages
    needs: build
    # Defense in depth if the manual workflow is dispatched on another branch.
    if: github.repository == 'QSOLKCB/DUAL-ASCENT' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
